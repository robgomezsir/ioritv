# Build and validate on merge to main
# Web-app deploy is handled by Vercel automatically
name: Validate Build on merge
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        working-directory: web-app
        run: npm ci
      - name: Build
        working-directory: web-app
        run: npm run build
